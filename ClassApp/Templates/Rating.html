<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feedback</title>

<style>

body{
    font-family: Arial, sans-serif;
    background:#f4f6f9;
    margin:0;
}

/* center box */
.container{
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
}

/* main feedback card */
.rating{
    background:white;
    padding:30px;
    width:420px;
    border-radius:10px;
    box-shadow:0 4px 15px rgba(0,0,0,0.15);
}

/* heading */
.rating h2{
    text-align:center;
    margin-bottom:20px;
}

/* labels */
label{
    display:block;
    margin-top:12px;
    margin-bottom:5px;
    font-weight:bold;
    color:#333;
}

/* inputs */
input, textarea, select{
    width:100%;
    padding:10px;
    border:1px solid #ccc;
    border-radius:6px;
    font-size:14px;
}

/* textarea height */
textarea{
    height:100px;
    resize:none;
}

/* faculty note */
.note{
    margin-top:15px;
    font-weight:bold;
    color:#444;
}

/* buttons */
button{
    width:100%;
    padding:12px;
    margin-top:15px;
    border:none;
    border-radius:6px;
    font-size:15px;
    cursor:pointer;
}

/* submit button */
button[type="submit"]{
    background:#0d6efd;
    color:white;
}

button[type="submit"]:hover{
    background:#0b5ed7;
}

/* back button */
button[type="button"]{
    background:#6c757d;
    color:white;
}

button[type="button"]:hover{
    background:#5a6268;
}

/* django messages */
.message{
    margin-top:15px;
    color:green;
    text-align:center;
    font-weight:bold;
}

</style>
</head>

<body>

<div class="container">
<div class="rating">

<h2>Feedback</h2>

<form method="post" enctype="multipart/form-data" action="{% url 'rating' %}">
{% csrf_token %}

<label>Your Name</label>
<input type="text" name="name" required>

<label>Your Email</label>
<input type="email" name="email" required>

<label>Your Feedback</label>
<textarea name="doubt" required></textarea>

<label>Rating (out of 5)</label>
<input type="number" name="rating" min="1" max="5" required>

<div class="note">Select Faculty to send your Feedback</div>

<select name="faculty" required>
    <option value="" disabled selected>Select Faculty</option>
    {% for faculty in faculties %}
        <option value="{{faculty.id}}">{{faculty.fname}}</option>
    {% endfor %}
</select>

<button type="submit">Submit Feedback</button>

<a href="{% url 'student_dashboard' %}">
    <button type="button">Back to Dashboard</button>
</a>

</form>

{% if messages %}
    {% for message in messages %}
        <div class="message">{{message}}</div>
    {% endfor %}
{% endif %}

</div>
</div>

{% include 'footer.html' %}
</body>
</html>
