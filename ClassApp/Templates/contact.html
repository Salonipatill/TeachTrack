{% extends 'public_base.html' %}
{% block title %}Contact us{% endblock %}
{% block public_content %}
<div class="page-head"><div><div class="eyebrow">GET IN TOUCH</div><h1>Contact TeachTrack</h1><p class="muted">Have a question or suggestion? Send us a message.</p></div></div>
<section class="panel form-panel">

    {% csrf_token %}
    {{ form.as_p }}
    <div class="form-actions"><button type="submit">Send message</button><a href="{% url 'index' %}">Back to home</a></div>
  </form>
</section>
{% endblock %}
