{% if page_obj.has_other_pages %}<nav class="pagination" aria-label="Pagination">{% if page_obj.has_previous %}<a href="?{% for key,val in request.GET.items %}{% if key != 'page' %}{{ key|urlencode }}={{ val|urlencode }}&{% endif %}{% endfor %}page={{ page_obj.previous_page_number }}">← Previous</a>{% endif %}<span>{{ page_obj.number }} / {{ page_obj.paginator.num_pages }}</span>{% if page_obj.has_next %}<a href="?{% for key,val in request.GET.items %}{% if key != 'page' %}{{ key|urlencode }}={{ val|urlencode }}&{% endif %}{% endfor %}page={{ page_obj.next_page_number }}">Next →</a>{% endif %}</nav>{% endif %}
